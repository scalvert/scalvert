<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title desc">
  <title id="title">Steve Calvert</title>
  <desc id="desc">A terminal window. whoami prints: Steve Calvert, software engineer at Glean. cat ~/focus prints: developer platforms, MCP, agent tooling, testing, docs tooling.</desc>
  <rect x="1" y="1" width="958" height="298" rx="12" fill="#ffffff" stroke="#d1d9e0" stroke-width="2"/>
  <path d="M1 13 a12 12 0 0 1 12 -12 h934 a12 12 0 0 1 12 12 v31 h-958 z" fill="#f6f8fa"/>
  <line x1="1" y1="44" x2="959" y2="44" stroke="#d1d9e0" stroke-width="2"/>
  <circle cx="28" cy="23" r="7" fill="#ff5f57"/>
  <circle cx="52" cy="23" r="7" fill="#febc2e"/>
  <circle cx="76" cy="23" r="7" fill="#28c840"/>
  <text x="480" y="28" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#59636e">scalvert@github: ~</text>
  <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="19">
    <text x="40" y="92"><tspan fill="#1a7f37">$</tspan><tspan fill="#1f2328"> whoami</tspan></text>
    <text x="40" y="132" font-size="30" font-weight="700" fill="#1f2328">Steve Calvert<tspan font-size="19" font-weight="400" fill="#59636e">  software engineer at Glean</tspan></text>
    <text x="40" y="186"><tspan fill="#1a7f37">$</tspan><tspan fill="#1f2328"> cat ~/focus</tspan></text>
    <text x="40" y="220"><tspan fill="#0969da">developer platforms</tspan><tspan fill="#59636e"> · </tspan><tspan fill="#0969da">MCP</tspan><tspan fill="#59636e"> · </tspan><tspan fill="#0969da">agent tooling</tspan><tspan fill="#59636e"> · </tspan><tspan fill="#0969da">testing</tspan><tspan fill="#59636e"> · </tspan><tspan fill="#0969da">docs tooling</tspan></text>
    <text x="40" y="266"><tspan fill="#1a7f37">$</tspan></text>
    <rect x="62" y="250" width="11" height="21" fill="#1f2328">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
